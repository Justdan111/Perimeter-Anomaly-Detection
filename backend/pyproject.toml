[project]
name = "backend"
version = "0.1.0"
description = "Perimeter anomaly detection — zone-based alerting over recorded video clips"
authors = [
    { name = "justdan111", email = "emmanuelngulube292@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "ultralytics>=8.4.157",
    # Direct dependencies only so the Linux source below applies to them;
    # ultralytics would pull them in anyway.
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "uvicorn[standard]>=0.53.0",
    "python-multipart>=0.0.32",
]

# This is an application, not a distributable library: the `app` package is
# imported from the project root, never built into a wheel. Without this, uv
# tries to build the project and expects a src/ layout, which conflicts with
# the app/ layout the architecture in docs/PROJECT.md specifies.
[tool.uv]
package = false
# `ultralytics` depends on the GUI build `opencv-python`, which drags in
# Qt/GUI libraries a server never uses and would bloat the Day 5 Docker image.
# Both it and `opencv-python-headless` install the same `cv2` module, so the
# headless build (a direct dependency above) fully satisfies ultralytics.
exclude-dependencies = ["opencv-python"]

# On Linux (the Docker image), install PyTorch's CPU-only build. The default
# PyPI build for Linux bundles CUDA — 16 nvidia-* packages, several GB — which
# a CPU-only host like Render can never use. macOS keeps the PyPI build (it is
# CPU/MPS only anyway), so local development is unchanged.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the project root on sys.path so tests import `app.services.zone_check`
# the same way the running service does.
pythonpath = ["."]
# Fail on deprecation warnings instead of printing them, so a new one is fixed
# when it appears rather than accumulating in the output unread.
filterwarnings = ["error::DeprecationWarning"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.0.0",
]
